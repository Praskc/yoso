<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="favHandGrad" x1="10" y1="10" x2="110" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="favLineGrad" x1="10" y1="10" x2="100" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
