  <!-- 6. Pulgar extendido (derecha) -->
  <path d="M 90 42 C 96 36 104 28 111 25 C 117 23 120 28 116 36 C 110 48 102 60 94 68 L 86 60 C 88 52 89 46 90 42 Z" fill="url(#favHandGrad)" stroke="#60A5FA" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 103 33 C 107 38 111 44 113 49" stroke="url(#favLineGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 96 44 C 100 48 104 54 106 59" stroke="url(#favLineGrad)" stroke-width="2.5" stroke-linecap="round"/>
