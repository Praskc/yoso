  <path d="M 23 25 L 34 21" stroke="url(#favLineGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 26 34 L 37 30" stroke="url(#favLineGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 2. Dedo Anular flexionado -->
  <path d="M 37 28 C 37 18 45 13 52 14 C 59 15 62 22 61 30 L 59 44 C 57 48 48 48 44 45 L 37 38 Z" fill="url(#favHandGrad)" stroke="#60A5FA" stroke-width="3" stroke-linejoin="round"/>

  <!-- 3. Dedo Medio flexionado -->
  <path d="M 58 24 C 58 14 66 10 74 11 C 81 12 84 18 83 26 L 81 42 C 79 46 70 47 66 44 L 58 35 Z" fill="url(#favHandGrad)" stroke="#60A5FA" stroke-width="3" stroke-linejoin="round"/>

